<div id="app-shell" class="app-shell hidden">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="10" fill="#1e40af"/>
          <path d="M12 16h24M12 24h24M12 32h16" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="36" cy="32" r="6" fill="#3b82f6" stroke="white" stroke-width="2"/>
          <path d="M33.5 32l1.5 1.5 3-3" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="sidebar-brand">PhanLich</span>
      </div>
      <button class="btn-sidebar-toggle" id="sidebar-toggle-btn" aria-label="Đóng/mở sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav"></nav>

    <div class="sidebar-footer">
      <div class="sidebar-user-info" id="sidebar-user-info"></div>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <button class="btn-mobile-menu" id="mobile-menu-btn" aria-label="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
      </div>
      <div class="topbar-right">
        <div class="topbar-role-switcher" id="role-switcher-wrap">
          <span class="role-label">Chế độ demo:</span>
          <div class="role-tabs" id="role-tabs"></div>
        </div>
        <div class="topbar-user" id="topbar-user">
          <div class="user-avatar" id="topbar-avatar">A</div>
          <div class="user-meta">
            <span class="user-name" id="topbar-name"></span>
            <span class="user-role-badge" id="topbar-role"></span>
          </div>
          <div class="user-dropdown" id="user-dropdown">
            <button class="dropdown-item" onclick="App.navigate('profile')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Thông tin cá nhân
            </button>
            <button class="dropdown-item danger" onclick="App.logout()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Đăng xuất
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="main-content" id="main-content"></main>
  </div>
</div>
