<div id="sidebar-overlay" class="sidebar-overlay hidden" aria-hidden="true"></div>

<div id="modal-container" class="modal-container hidden" role="dialog" aria-modal="true"
     aria-labelledby="modal-title" tabindex="-1">
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal-box" id="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-title"></h3>
      <button class="btn-modal-close" id="modal-close-btn" aria-label="Đóng">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<div id="toast-container" class="toast-container" aria-live="polite"></div>

<div id="confirm-dialog" class="confirm-dialog hidden" role="alertdialog" aria-modal="true"
     aria-labelledby="confirm-title" aria-describedby="confirm-message" tabindex="-1">
  <div class="confirm-backdrop"></div>
  <div class="confirm-box">
    <div class="confirm-icon" id="confirm-icon"></div>
    <h3 class="confirm-title" id="confirm-title"></h3>
    <p class="confirm-message" id="confirm-message"></p>
    <div class="confirm-input-wrap hidden" id="confirm-input-wrap">
      <label for="confirm-reason-input" id="confirm-reason-label">Lý do</label>
      <textarea id="confirm-reason-input" class="form-input" rows="2" placeholder="Nhập lý do..."></textarea>
    </div>
    <div class="confirm-actions">
      <button class="btn btn-secondary" id="confirm-cancel-btn">Hủy</button>
      <button class="btn btn-primary" id="confirm-ok-btn">Xác nhận</button>
    </div>
  </div>
</div>
