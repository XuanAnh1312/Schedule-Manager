spring.application.name=schedule-manager-api
spring.profiles.active=sqlserver

# ── Module yêu cầu/nghỉ phép/thông báo (Bảo) ───────────────────────────────
# Múi giờ nghiệp vụ: ngày/giờ ca được hiểu theo múi giờ này.
app.timezone=Asia/Ho_Chi_Minh
# Bật/tắt job nền (dispatch outbox + nhắc hạn đăng ký). Đặt false nếu instance không được chạy job.
app.scheduling.enabled=true
# Chu kỳ quét outbox (ms), số sự kiện mỗi lượt, số lần thử trước khi chuyển 'dead'.
app.events.poll-ms=5000
app.events.batch-size=50
app.events.max-attempts=8
# Lịch chạy job nhắc hạn (cron Spring). Mốc nhắc (48h, 24h…) do Admin cấu hình qua API, không đặt ở đây.
app.notifications.deadline-cron=0 */15 * * * *
