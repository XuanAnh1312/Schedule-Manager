# Test profile: no real SQL Server, no Flyway, no .env needed.
# This file is loaded by Surefire (spring.profiles.active=test) and by
# @TestPropertySource / @ActiveProfiles("test") in @WebMvcTest classes.
#
# When a test also activates the "sqlserver" profile (e.g. to satisfy
# @Profile("sqlserver") beans), the sqlserver-profile properties load first,
# then this file overrides them — keeping tests self-contained.

# ── JWT ──────────────────────────────────────────────────────────────────────
# JwtUtil requires a secret ≥ 32 characters (256-bit HMAC-SHA).
app.jwt.secret=test-secret-key-at-least-32-chars-long-for-hmac
app.jwt.expiration-ms=3600000

# ── Database ─────────────────────────────────────────────────────────────────
# Override the SQL Server datasource with an in-memory H2 database.
# MODE=MSSQLServer makes H2 accept T-SQL syntax well enough for schema checks.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.connection-timeout=5000

# ── Flyway ───────────────────────────────────────────────────────────────────
# Disable Flyway entirely in tests — migrations use SQL Server syntax that H2
# cannot execute, and test data is handled by mock beans or test fixtures.
spring.flyway.enabled=false

# ── Config import ────────────────────────────────────────────────────────────
# Disable the .env import so tests are fully self-contained.
spring.config.import=

# ── Module của Bảo: không chạy job nền trong test ─────────────────────────────
app.scheduling.enabled=false
app.timezone=Asia/Ho_Chi_Minh
