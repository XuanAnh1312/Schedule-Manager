<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lịch làm việc · HRM</title><link rel="stylesheet" href="css/workspace.css">
  <script src="js/workspace.js" defer></script>
</head>
<body>
  <section id="login" class="login-card">
    <span class="eyebrow">QUẢN LÝ NHÂN SỰ</span><h1>Cùng nhau làm việc tốt hơn.</h1>
    <p>Đăng nhập để đăng ký thời gian, xem lịch và quản lý công việc.</p>
    <form id="login-form"><label>Tài khoản<input name="username" autocomplete="username" required maxlength="30"></label>
      <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Đăng nhập</button></form>
    <p id="login-error" role="alert"></p>
  </section>
  <div id="workspace" hidden>
    <header><a href="/" class="brand">HRM<span>Không gian làm việc</span></a><div><span id="identity"></span><button id="logout" class="secondary">Đăng xuất</button></div></header>
    <nav id="navigation" aria-label="Phân hệ"></nav>
    <main><div class="page-heading"><div><span class="eyebrow" id="context-label">Lịch làm việc</span><h1 id="page-title"></h1></div><button id="refresh" class="secondary">Tải lại</button></div>
      <div id="notice" role="status" aria-live="polite"></div><div id="content" aria-busy="false"></div>
    </main>
  </div>
  <dialog id="editor"><form id="editor-form"><h2 id="editor-title"></h2><div id="editor-fields"></div><p id="editor-error" role="alert"></p><footer><button type="button" id="editor-cancel" class="secondary">Hủy</button><button type="submit" id="editor-save">Lưu</button></footer></form></dialog>
</body>
</html>
